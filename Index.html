<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Mary - From MarkJoseph</title>
<style>body{font-family:Arial;background:#fef9e7;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;text-align:center}.box{background:white;padding:24px;border-radius:22px;box-shadow:0 12px 35px rgba(0,0,0,.12);max-width:390px;width:90%}h1{color:#4a4a4a}p{color:#555;font-size:17px}button{padding:12px 26px;border:none;border-radius:30px;font-size:17px;margin:8px;cursor:pointer;font-weight:bold}.yes{background:#f5b400;color:#222;width:220px}.no{background:#eee;position:absolute}input{width:88%;padding:12px;margin:8px 0;border:2px solid #ffeaa7;border-radius:12px}#step2{display:none}img.main{width:100%;border-radius:16px;margin-bottom:12px}</style></head>
<body>
<div class="box" id="step1">
<img class="main" src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=400">
<h1>Hey Mary! 👋</h1>
<p>It's <b>MarkJoseph</b><br>Can we catch up soon? Would be nice to see you 😊</p>
<button class="yes" onclick="goStep2()">YES, let's meet! 🙌</button>
<button class="no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No</button>
<p style="font-size:11px;color:#999">From MarkJoseph</p>
</div>
<div class="box" id="step2">
<h1>Awesome! 🙌</h1>
<p>Where & what time works for you?</p>
<input id="where" placeholder="Where? e.g. Kapsabet town">
<input id="time" placeholder="Time? e.g. Saturday 2pm">
<button class="yes" onclick="sendToMe()">Send to MarkJoseph</button>
<p id="thanks"></p>
</div>
<script>
function moveNo(){let b=document.getElementById('noBtn');b.style.left=Math.random()*75+'%';b.style.top=Math.random()*75+'%';}
function goStep2(){document.getElementById('step1').style.display='none';document.getElementById('step2').style.display='block';}
function sendToMe(){let w=document.getElementById('where').value.trim(),t=document.getElementById('time').value.trim();if(!w||!t){alert('Fill where & time');return;}let num="254743876723",msg=`Hi MarkJoseph! It's Mary YES let's meet! Place: ${w} Time: ${t}`,wa=`https://wa.me/${num}?text=${encodeURIComponent(msg)}`;document.getElementById('thanks').innerHTML=`<br><a href='${wa}' style='background:#25D366;color:white;padding:12px 22px;border-radius:30px;text-decoration:none;display:inline-block;'>Confirm on WhatsApp ✅</a>`;window.open(wa,'_blank');}
</script></body></html>
